# ─── Errata Review ───────────────────────────────────────────────────────────
# Copy to .github/workflows/errata.yml
#
# Required: add ANTHROPIC_API_KEY as a repository secret.
# Settings → Secrets and variables → Actions → New repository secret

name: Errata Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    name: Errata
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: raven-studios/errata@v1
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional — defaults shown:
          # min-severity: should-fix   # must-fix | should-fix | consider
          # max-files: 50
          # fail-on: must-fix          # must-fix | should-fix | consider | never


# ─── Errata Autofix ──────────────────────────────────────────────────────────
# Copy to .github/workflows/errata-fix.yml
#
# Triggered when anyone comments "/errata fix" on a PR.
# Errata re-reviews the PR, applies safe fixes directly to the branch,
# and posts a summary of what was fixed vs. what needs manual attention.
#
# Required: same ANTHROPIC_API_KEY secret.
# Additional permission needed: contents: write (to commit fixes).

